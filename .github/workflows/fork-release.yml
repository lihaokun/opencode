# Publishes a fork build as a GitHub release on this fork, driven by tags.
#
# Push a tag and the release follows. Which kind depends on where the tagged
# commit lives:
#
#   on main            v1.18.31-fmv3           stable release, marked Latest
#   on dev, not main   v1.18.31-fmv3-beta.2    pre-release
#   anywhere else      refused
#
# The tag name has to match the branch -- a stable-looking tag on dev or a
# beta-looking tag on main fails here rather than publishing under the wrong
# label. Release notes come from the tag's annotation (a lightweight tag gets
# GitHub's generated notes), followed by install instructions. Creating the release in the GitHub UI works too:
# that pushes the tag, this run finds the release and only adds the assets.
#
# Not publish.yml: that one bumps the npm version and publishes `opencode-ai`
# to the public registry, which is upstream's to do and is guarded by a
# repository check that is false here. This builds the same binaries and puts
# them on a release of this repository, nothing more.
#
# The heavy lifting is already in packages/opencode/script/build.ts, which
# cross-compiles every target from one Linux runner -- the same single-runner
# path upstream uses for every release. It can package and upload too, under
# OPENCODE_RELEASE, but that publishes all twelve targets under its own naming;
# this keeps the five the fork actually ships and the archive formats the
# existing releases use, so it does its own packaging instead.
name: fork-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again (e.g. v1.18.31-fmv3). Rebuilds and replaces that release's assets."
        required: true
        type: string

permissions:
  contents: write

env:
  ASSETS: >-
    opencode-linux-x64 opencode-linux-arm64
    opencode-darwin-x64 opencode-darwin-arm64
    opencode-windows-x64

jobs:
  release:
    # Upstream has its own release pipeline; this must never run there.
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      # Resolves the tag to a commit, a channel and a version. The commit is
      # taken from the tag itself rather than GITHUB_SHA, which for an annotated
      # tag can be the tag object.
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch -q origin main dev
          if git merge-base --is-ancestor "$SHA" origin/main; then
            CHANNEL=stable
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fmv[0-9]+$ ]]; then
              echo "::error::$TAG is on main, so it is a stable release and must be named like v1.18.31-fmv3 (no -beta suffix)"
              exit 1
            fi
          elif git merge-base --is-ancestor "$SHA" origin/dev; then
            CHANNEL=beta
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fmv[0-9]+-beta\.[0-9]+$ ]]; then
              echo "::error::$TAG is on dev but not on main, so it is a beta and must be named like v1.18.31-fmv3-beta.1"
              exit 1
            fi
          else
            echo "::error::$TAG ($SHA) is on neither main nor dev; releases are cut only from those two branches"
            exit 1
          fi
          # Notes: the annotation of an annotated tag, or GitHub's generated
          # notes for a lightweight tag, followed by the install instructions
          # every release carries. The install block is a quoted heredoc: it
          # holds PowerShell `$env:` and bash `$HOME` that must stay literal.
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)%0a%0a%(contents:body)' \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > notes.md
          fi
          DOCS_BRANCH=$([ "$CHANNEL" = stable ] && echo main || echo dev)
          printf '\n' >> notes.md
          sed "s/__DOCS_BRANCH__/$DOCS_BRANCH/" >> notes.md <<'INSTALL'
          ## 安装

          选对应平台的包。解压后 `bin/` 里有 `opencode` 和 `rg`（ripgrep），**两个文件放在同一目录并把该目录加入 PATH**：程序按 PATH 找 `rg`，找不到会去 GitHub 下载。

          | 平台 | 资产 |
          |---|---|
          | Windows x64 | `opencode-windows-x64.zip` |
          | macOS Apple Silicon | `opencode-darwin-arm64.tar.gz` |
          | macOS Intel | `opencode-darwin-x64.tar.gz` |
          | Linux x64 | `opencode-linux-x64.tar.gz` |
          | Linux arm64 | `opencode-linux-arm64.tar.gz` |

          **Windows**（PowerShell，在下载目录执行）：

          ```powershell
          Expand-Archive .\opencode-windows-x64.zip -DestinationPath $env:TEMP\opencode -Force
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.opencode\bin" | Out-Null
          Copy-Item "$env:TEMP\opencode\opencode-windows-x64\bin\*" "$env:USERPROFILE\.opencode\bin" -Force
          [Environment]::SetEnvironmentVariable("Path", "$env:USERPROFILE\.opencode\bin;" + [Environment]::GetEnvironmentVariable("Path", "User"), "User")
          ```

          重开终端后 `opencode --version` 应显示本版本号。二进制未签名，SmartScreen 若拦截选"仍要运行"。

          **macOS / Linux**（把 `darwin-arm64` 换成你的包名；bash 用户把 `~/.zshrc` 换成 `~/.bashrc`）：

          ```bash
          tar -xzf opencode-darwin-arm64.tar.gz
          mkdir -p ~/.opencode/bin && cp opencode-darwin-arm64/bin/* ~/.opencode/bin/
          echo 'export PATH="$HOME/.opencode/bin:$PATH"' >> ~/.zshrc
          ```

          macOS 若提示"无法打开"（未签名、未公证）：`xattr -dr com.apple.quarantine ~/.opencode/bin`。

          **关闭官方自动更新（必须）**：官方更新器会把这个 fork 版本换回官方 1.18.x。在 `~/.config/opencode/opencode.json`（Windows 是 `%USERPROFILE%\.config\opencode\opencode.json`）里加：

          ```json
          { "autoupdate": false }
          ```

          校验：`sha256sum -c sha256sums.txt --ignore-missing`；Windows 用 `Get-FileHash .\opencode-windows-x64.zip` 与 `sha256sums.txt` 对照。
          更多说明见 [FORK_INSTALL.md](https://github.com/lihaokun/opencode/blob/__DOCS_BRANCH__/FORK_INSTALL.md)。
          INSTALL
          echo "resolved $TAG -> $SHA ($CHANNEL)"
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "channel=$CHANNEL"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun

      # No OPENCODE_RELEASE: that flag makes build.ts package and upload every
      # target itself. Building only is what is wanted here. The version is the
      # tag without its leading v; build.ts reads nothing else.
      - name: Build every target
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ steps.tag.outputs.version }}

      # build.ts does not bundle ripgrep -- upstream declares it a package
      # dependency for AUR and Homebrew instead, which a downloaded archive has
      # no equivalent of. Without it the program fetches ripgrep from GitHub on
      # first use, so a machine that is offline, or behind a proxy that is not,
      # has a broken grep and glob. The fork's earlier releases carried it. The
      # version comes from the source that decides what to fetch at runtime, so
      # the bundled copy cannot drift from the expected one.
      - name: Bundle ripgrep for each target
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          RG=$(grep -oP 'const VERSION = "\K[^"]+' ../core/src/ripgrep/binary.ts)
          echo "bundling ripgrep $RG"
          for key in $ASSETS; do
            case "$key" in
              *linux-x64)     triple=x86_64-unknown-linux-musl; ext=tar.gz ;;
              *linux-arm64)   triple=aarch64-unknown-linux-gnu; ext=tar.gz ;;
              *darwin-x64)    triple=x86_64-apple-darwin;       ext=tar.gz ;;
              *darwin-arm64)  triple=aarch64-apple-darwin;      ext=tar.gz ;;
              *windows-x64)   triple=x86_64-pc-windows-msvc;    ext=zip ;;
              *windows-arm64) triple=aarch64-pc-windows-msvc;   ext=zip ;;
              *) echo "::error::no ripgrep triple known for '$key'"; exit 1 ;;
            esac
            stem="ripgrep-$RG-$triple"
            curl -fsSL -o "/tmp/$stem.$ext" "https://github.com/BurntSushi/ripgrep/releases/download/$RG/$stem.$ext"
            rm -rf /tmp/rg-extract && mkdir -p /tmp/rg-extract
            if [ "$ext" = "zip" ]; then
              unzip -qo "/tmp/$stem.$ext" -d /tmp/rg-extract
              install -m 0755 "/tmp/rg-extract/$stem/rg.exe" "dist/$key/bin/rg.exe"
            else
              tar -xzf "/tmp/$stem.$ext" -C /tmp/rg-extract
              install -m 0755 "/tmp/rg-extract/$stem/rg" "dist/$key/bin/rg"
            fi
          done

      # tar.gz for linux and darwin, zip for windows -- matching the archives
      # the fork's existing releases carry.
      - name: Package the published targets
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          mkdir -p out
          for key in $ASSETS; do
            if [ ! -d "dist/$key/bin" ]; then
              echo "::error::build produced no dist/$key/bin -- is '$key' a real build key?"
              exit 1
            fi
            # The whole <key>/ directory, not its contents: an archive that
            # unpacks to opencode-linux-x64/bin/opencode is what the existing
            # releases carry and what their install instructions name. It also
            # keeps package.json, and bin/rg beside the binary -- without that
            # ripgrep the program downloads one at runtime instead.
            case "$key" in
              *windows*) (cd dist && zip -qr "../out/$key.zip" "$key") ;;
              *)         tar -czf "out/$key.tar.gz" -C dist "$key" ;;
            esac
          done
          (cd out && sha256sum opencode-* > sha256sums.txt)
          ls -l out

      # A release that already exists (created in the UI, or a rebuild through
      # workflow_dispatch) keeps its notes and its pre-release flag; only the
      # assets are replaced.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
          else
            args=(--target "$SHA" --title "$VERSION" --notes-file notes.md)
            if [ "$CHANNEL" = beta ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" packages/opencode/out/* --clobber
          gh release view "$TAG" --json isPrerelease,assets --jq '"prerelease=\(.isPrerelease)", .assets[].name'
